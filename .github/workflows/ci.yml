name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pin comes from the repo, not from a hard-coded number here: the crate
      # declares `rust-version`, and CI honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Rust generates its bindings in build.rs from the .proto, so it cannot
      # drift the way a checked-in file can — but the proto must still be valid,
      # and a build failure here is a codegen failure.
      - run: cargo build --all-targets
      # The shared config cases require a broker and FAIL without one, rather than
      # skipping: a silent skip reports success while never touching the KV path.
      # This job therefore starts one; the `conformance` job below additionally runs
      # the whole suite inside the pinned image.
      - name: start nats
        run: |
          curl -fsSL -o /tmp/nats.tgz \
            https://github.com/nats-io/nats-server/releases/download/v2.15.1/nats-server-v2.15.1-linux-amd64.tar.gz
          tar -xzf /tmp/nats.tgz -C /tmp
          /tmp/nats-server-v2.15.1-linux-amd64/nats-server -js -p 4222 &
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then echo "nats up"; exit 0; fi
            sleep 1
          done
          echo "nats did not start"; exit 1
      - run: cargo test --all-targets
        env:
          EASYBUS_NATS_URL: nats://127.0.0.1:4222
      - run: cargo fmt --check
      # clippy is advisory: it must not block a merge on a new lint, but it should
      # still be visible in the log.
      - run: cargo clippy --all-targets || true

  # A real broker, in the SAME image the other three SDKs use.
  #
  # The job above runs the suite against NO broker: the config cases skip themselves
  # when EASYBUS_NATS_URL is unset, so a Rust-only run never exercises the KV path at
  # all. That path is the only way a restarted extension learns its configuration,
  # and it is where every config defect in this SDK was found.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--exit-code-from` makes the container's exit code the step's exit code, so a
      # failing assertion fails the job without extra plumbing.
      - name: conformance in a pinned environment
        run: |
          docker compose up --build --abort-on-container-exit \
            --exit-code-from conformance

      - name: logs
        if: failure()
        run: docker compose logs --no-color

      - name: down
        if: always()
        run: docker compose down -v
