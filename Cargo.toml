[package]
name = "easybus-sdk"
version = "0.1.0"
edition = "2021"
# The minimum toolchain that can build this crate.
#
# 1.86 is forced by idna_adapter 1.2.2 (async-nats -> url -> idna), which declares
# edition 2024 — and 2024 edition needs Cargo 1.85+.
#
# What this line does NOT do: it does not improve the error on an older toolchain.
# Cargo fails while parsing the DEPENDENCY's manifest, before it ever looks at
# this field:
#   error: failed to parse manifest at .../idna_adapter-1.2.2/Cargo.toml
#   Caused by: feature `edition2024` is required
# (verified on Rust 1.83 with and without this line — identical output).
#
# What it DOES do: it states the real requirement for `cargo publish` validation,
# and lets a resolver that honours MSRV pick a compatible dependency set.
# Keep it accurate; do not expect it to fix error messages.
rust-version = "1.86"
description = "easybus protocol SDK (Rust) — the multi-tenant extension bus. Wire contract: proto/easybus/v1/protocol.proto (the single source of truth, shared with easybus-sdk Go/TypeScript/Python)."
license = "MIT"

[dependencies]
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-nats = "0.38"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"

# No build-dependencies: build.rs only checks that the committed file exists. Generation is
# `make gen` (buf), so this crate no longer needs prost-build or a vendored protoc to compile
# — which also removes protoc from the build requirements of every consumer.

# `buf` regenerates into src/gen and the result is COMMITTED. prost's default writes into
# OUT_DIR, which is invisible to review, to grep, and to `git diff` — so a contract change
# that altered a message looked like nothing happened. Committing the output is what the other
# three SDKs do, and it makes drift something a bot can detect and fix.
[package.metadata.proto]
generated = "src/gen"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[[bin]]
name = "rs-ext"
path = "interop/rs-ext.rs"

[[bin]]
name = "rs-agent"
path = "interop/rs-agent.rs"
